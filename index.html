<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Saver</title>
  <link rel="stylesheet" href="styles.css?v=logo-qr-1">
  <script defer src="qrious.min.js?v=logo-qr-1"></script>
  <script defer src="app.js?v=logo-qr-1"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Contact Saver home">
      <span class="brand-mark">CS</span>
      <span>
        <strong>Contact Saver</strong>
        <small>QR contact cards</small>
      </span>
    </a>
    <nav class="top-actions" aria-label="Main navigation">
      <a class="nav-link" href="./">Create</a>
      <a class="status-pill" href="#saved" id="contactCount">0 cards</a>
    </nav>
  </header>

  <main>
    <section class="workspace" id="createView" aria-labelledby="editorTitle">
      <div class="panel editor-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Client contact</p>
            <h1 id="editorTitle">Create a QR that opens contact save</h1>
          </div>
          <button class="ghost-button" type="button" id="resetForm">New</button>
        </div>

        <form id="contactForm" class="contact-form" autocomplete="off">
          <input type="hidden" name="id">
          <div class="field-grid">
            <label>
              <span>Full name</span>
              <input name="fullName" placeholder="Aanya Shah" autocomplete="section-contact name">
            </label>
            <label>
              <span>Role</span>
              <input name="role" placeholder="Founder" autocomplete="section-contact organization-title">
            </label>
            <label>
              <span>Company</span>
              <input name="company" placeholder="Brill Brains" autocomplete="section-contact organization">
            </label>
            <label>
              <span>Email</span>
              <input name="email" type="email" placeholder="hello@example.com" autocomplete="section-contact email">
            </label>
            <label>
              <span>Website</span>
              <input name="website" placeholder="https://example.com" autocomplete="section-contact url">
            </label>
            <label>
              <span>Address</span>
              <input name="address" placeholder="City, state, country" autocomplete="section-contact street-address">
            </label>
            <div class="wide phone-section">
              <div class="label-row">
                <span>Phone numbers</span>
              </div>
              <div id="phoneFields" class="phone-fields"></div>
              <datalist id="countryCodes">
                <option value="+91">India</option>
                <option value="+1">United States / Canada</option>
                <option value="+44">United Kingdom</option>
                <option value="+61">Australia</option>
                <option value="+971">United Arab Emirates</option>
                <option value="+65">Singapore</option>
                <option value="+81">Japan</option>
                <option value="+49">Germany</option>
                <option value="+33">France</option>
                <option value="+39">Italy</option>
              </datalist>
            </div>
          </div>

          <div class="form-actions">
            <button class="primary-button" type="submit">Save Card</button>
            <p id="formMessage" role="status"></p>
          </div>
        </form>
      </div>

      <aside class="panel qr-panel" aria-labelledby="qrTitle">
        <div class="panel-head compact">
          <div>
            <p class="eyebrow">Live QR</p>
            <h2 id="qrTitle">Scan to save contact</h2>
          </div>
        </div>

        <div class="qr-box">
          <canvas id="qrCanvas" width="320" height="320" aria-label="QR code"></canvas>
          <p class="qr-error" id="qrError" hidden></p>
        </div>

        <div class="logo-upload">
          <label for="qrLogo">
            <span>Center image</span>
            <input id="qrLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
          </label>
          <button class="ghost-button" type="button" id="removeQrLogo" hidden>Remove Image</button>
          <p id="logoMessage" role="status"></p>
        </div>

        <div class="share-links">
          <button class="primary-button" type="button" id="downloadQr">Download HD PNG</button>
          <a id="downloadVcf">Download VCF</a>
        </div>

        <div class="phone-card" id="previewCard">
          <div class="avatar">CS</div>
          <h3>Select a card</h3>
          <p>Create a contact to preview the QR details.</p>
        </div>
      </aside>
    </section>

    <section class="saved-page" id="savedView" aria-labelledby="savedTitle" hidden>
      <div class="saved-head">
        <div>
          <p class="eyebrow">Saved locally</p>
          <h1 id="savedTitle">Saved cards</h1>
        </div>
        <div class="saved-actions">
          <a class="ghost-button" href="#deleted" id="deletedToggle">Deleted Cards</a>
          <a class="primary-button" href="./">Create New</a>
        </div>
      </div>
      <div id="contactList" class="contact-list"></div>
    </section>
  </main>
</body>
</html>
